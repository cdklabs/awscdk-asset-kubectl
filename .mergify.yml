# ~~ Generated by projen. To modify, edit .projenrc.ts and run "npx projen".

queue_rules:
  - name: default
    update_method: merge
    queue_conditions:
      - "#approved-reviews-by>=1"
      - -label~=(do-not-merge)
      - status-success=build
      - status-success=package-js
      - status-success=package-java
      - status-success=package-python
      - status-success=package-dotnet
      - status-success=package-go
    merge_method: squash
    commit_message_template: |-
      {{ title }} (#{{ number }})

      {{ body }}
pull_request_rules:
  - name: backport patches to supported branches
    conditions:
      - label=backport-to-supported-branches
      - base=kubectl-v35/main
    actions:
      backport:
        branches:
          - kubectl-v34/main
          - kubectl-v33/main
        labels:
          - auto-approve
  - name: Automatic merge on approval and successful build
    actions:
      delete_head_branch: {}
      queue:
        name: default
    conditions:
      - "#approved-reviews-by>=1"
      - -label~=(do-not-merge)
      - status-success=build
      - status-success=package-js
      - status-success=package-java
      - status-success=package-python
      - status-success=package-dotnet
      - status-success=package-go
merge_queue:
  max_parallel_checks: 1
